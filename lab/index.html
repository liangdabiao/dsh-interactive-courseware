<!doctype html>
<html lang="zh-CN" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课件放映厅 · 互动翻页课件</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside class="rail">
  <a class="brand" href="#/">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="9" width="12" height="8" rx="2"></rect>
        <path d="M6 9V6.5A1.5 1.5 0 017.5 5h3A1.5 1.5 0 0112 6.5V9"></path>
        <circle cx="9" cy="13" r="2"></circle>
        <path d="M18.5 11.5l3-2v9l-3-2z"></path>
        <path d="M4 20.5h10"></path>
      </svg>
    </span>
    <span class="brand-text"><b>课件放映厅</b><small>翻页课件 · 多页页面 + 播放器 + 单文件</small></span>
  </a>
  <nav class="nav">
    <div class="nav-group">工作台</div>
    <a href="#/" data-view="home">概览</a>
    <a href="#/new" data-view="new">发起制作</a>
    <a href="#/archives" data-view="archives">课件档案<span class="count" id="nav-archives"></span></a>
    <a href="#/preview" data-view="preview">课件预览</a>
    <a href="#/history" data-view="history">档案历史<span class="count" id="nav-history"></span></a>
    <div class="nav-group">方法</div>
    <a href="#/guide" data-view="guide">制作规范</a>
  </nav>
  <div class="rail-foot" id="rail-foot"></div>
</aside>

<main class="main" id="app"><div class="loading">加载中…</div></main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="课件档案详情">
  <div class="viewer-bar">
    <span class="title" id="viewer-title"></span>
    <span class="grow"></span>
    <button id="viewer-copy" title="复制">复制</button>
    <button id="viewer-close" title="关闭（Esc）">关闭</button>
  </div>
  <div class="viewer-body" id="viewer-body"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
